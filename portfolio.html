// ─────────────────────────────────────────────
//  Toggle contributions
// ─────────────────────────────────────────────
function toggleContrib(id, btn) {
    const el = document.getElementById("contrib-" + id);
    const open = el.classList.toggle("open");
    btn.textContent = open ? "– contributions" : "+ contributions";
}

// ─────────────────────────────────────────────
//  App state
// ─────────────────────────────────────────────
let activeTags = new Set();
let activeOrgs = new Set();
let sortMode = "effort-desc";
let currentView = "projects"; // "projects" | "feed"

// Derive unique tags and orgs for each dataset
const allProjectTags = [...new Set(PROJECTS.flatMap(p => p.tags))].sort();
const allProjectOrgs = [...new Set(PROJECTS.map(p => p.organization).filter(Boolean))].sort();
const allFeedTags    = [...new Set(FEED.flatMap(f => f.tags || []))].sort();
const allFeedOrgs    = [...new Set(FEED.map(f => f.organization).filter(Boolean))].sort();

function currentTags() { return currentView === "projects" ? allProjectTags : allFeedTags; }
function currentOrgs() { return currentView === "projects" ? allProjectOrgs : allFeedOrgs; }

// ─────────────────────────────────────────────
//  View switcher
// ─────────────────────────────────────────────
function switchView(view) {
    currentView = view;
    activeTags.clear();
    activeOrgs.clear();
    document.getElementById("view-projects").classList.toggle("active", view === "projects");
    document.getElementById("view-feed").classList.toggle("active", view === "feed");

    // Show/hide sort control — not applicable to feed (always date-desc)
    document.getElementById("sort-row").style.display = view === "projects" ? "" : "none";

    rebuildPills();
    render();
}

// ─────────────────────────────────────────────
//  Render controls
// ─────────────────────────────────────────────
function buildPills(containerId, items, activeSet, onToggle) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    items.forEach(item => {
        const pill = document.createElement("button");
        pill.className = "pill" + (activeSet.has(item) ? " active" : "");
        pill.textContent = item;
        pill.addEventListener("click", () => onToggle(item));
        container.appendChild(pill);
    });
}

function rebuildPills() {
    buildPills("tag-filters", currentTags(), activeTags, tag => {
        activeTags.has(tag) ? activeTags.delete(tag) : activeTags.add(tag);
        rebuildPills();
        render();
    });
    buildPills("org-filters", currentOrgs(), activeOrgs, org => {
        activeOrgs.has(org) ? activeOrgs.delete(org) : activeOrgs.add(org);
        rebuildPills();
        render();
    });
}

function initControls() {
    rebuildPills();
    document.getElementById("sort-select").addEventListener("change", e => {
        sortMode = e.target.value;
        render();
    });
}

// ─────────────────────────────────────────────
//  Filter + sort (projects)
// ─────────────────────────────────────────────
function getFilteredProjects() {
    return PROJECTS.filter(p => {
        if (activeTags.size > 0 && ![...activeTags].every(t => p.tags.includes(t))) return false;
        if (activeOrgs.size > 0 && !activeOrgs.has(p.organization)) return false;
        return true;
    });
}

function getSorted(projects) {
    return [...projects].sort((a, b) => {
        if (sortMode === "effort-desc") return b.effort - a.effort;
        if (sortMode === "effort-asc") return a.effort - b.effort;
        if (sortMode === "date-desc") return new Date(b.startDate) - new Date(a.startDate);
        if (sortMode === "date-asc") return new Date(a.startDate) - new Date(b.startDate);
        if (sortMode === "title-asc") return a.title.localeCompare(b.title);
        return 0;
    });
}

// ─────────────────────────────────────────────
//  Filter (feed)
// ─────────────────────────────────────────────
function getFilteredFeed() {
    return FEED.filter(f => {
        const tags = f.tags || [];
        if (activeTags.size > 0 && ![...activeTags].every(t => tags.includes(t))) return false;
        if (activeOrgs.size > 0 && !activeOrgs.has(f.organization)) return false;
        return true;
    }).sort((a, b) => new Date(b.date) - new Date(a.date));
}

// ─────────────────────────────────────────────
//  Master render dispatcher
// ─────────────────────────────────────────────
function render() {
    if (currentView === "projects") renderProjects();
    else renderFeed();
}

// ─────────────────────────────────────────────
//  Render projects
// ─────────────────────────────────────────────
function effortDots(n) {
    let html = '<div class="effort-dots" title="Effort: ' + n + '/5">';
    for (let i = 1; i <= 5; i++) {
        html += '<div class="dot' + (i <= n ? " filled" : "") + '"></div>';
    }
    html += "</div>";
    return html;
}

function formatDate(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    return d.toLocaleDateString("en-US", { month: "short", year: "numeric" });
}

function renderProjects() {
    const filtered = getFilteredProjects();
    const sorted = getSorted(filtered);

    const meta = document.getElementById("results-meta");
    meta.textContent = sorted.length + " of " + PROJECTS.length + " projects";

    const list = document.getElementById("project-list");
    if (sorted.length === 0) {
        list.innerHTML = '<div class="no-results">No projects match the selected filters.</div>';
        return;
    }

    list.innerHTML = sorted.map(p => {
        const metaBadges = [
            '<span class="meta-badge">' + formatDate(p.startDate) + "</span>",
            p.organization ? '<span class="meta-badge org">' + p.organization + "</span>" : "",
            p.mentor ? '<span class="meta-badge mentor">Mentor: ' + p.mentor + "</span>" : ""
        ].filter(Boolean).join("");

        const tags = p.tags.map(t =>
            '<span class="tag">' + t + "</span>"
        ).join("");

        const links = p.links.length > 0
            ? '<div class="project-links">' + p.links.map(l =>
                '<a href="' + l.href + '" target="_blank">' + l.label + "</a>"
              ).join("") + "</div>"
            : "";

        const contributionsHtml = p.contributions && p.contributions.length > 0
            ? `<div class="contributions" id="contrib-${p.id}">
                <ul>${p.contributions.map(c => '<li>' + c + '</li>').join("")}</ul>
               </div>
               <button class="read-more-btn" onclick="toggleContrib('${p.id}', this)">+ contributions</button>`
            : "";

        return `
        <div class="project-card">
            <div class="project-header">
                <div class="project-title">${p.title}</div>
                ${effortDots(p.effort)}
            </div>
            <div class="project-meta">${metaBadges}</div>
            <p class="project-desc">${p.description}</p>
            <div class="project-tags">${tags}</div>
            ${links}
            ${contributionsHtml}
        </div>`;
    }).join("");
}

// ─────────────────────────────────────────────
//  Render feed
// ─────────────────────────────────────────────
function renderFeed() {
    const filtered = getFilteredFeed();
    const meta = document.getElementById("results-meta");
    meta.textContent = filtered.length + " of " + FEED.length + " feed items";

    const list = document.getElementById("project-list");
    if (filtered.length === 0) {
        list.innerHTML = '<div class="no-results">No feed items match the selected filters.</div>';
        return;
    }

    list.innerHTML = filtered.map(f => {
        const projectObj = f.project ? PROJECTS.find(p => p.id === f.project) : null;
        const projectBadge = projectObj
            ? `<a class="feed-project-link" href="#${projectObj.id}" onclick="switchView('projects')">${projectObj.title}</a>`
            : "";
        const orgBadge = f.organization
            ? `<span class="meta-badge org">${f.organization}</span>`
            : "";
        const tags = (f.tags || []).map(t => `<span class="tag">${t}</span>`).join("");

        // images: accept a single path string or an array of paths
        const imgs = f.images
            ? (Array.isArray(f.images) ? f.images : [f.images])
            : [];
        const imagesHtml = imgs.length > 0
            ? `<div class="feed-images feed-images-${Math.min(imgs.length, 3)}">
                ${imgs.map(src => `<img src="${src}" alt="" loading="lazy" onclick="openLightbox('${src}')">`).join("")}
               </div>`
            : "";

        // pdf: inline scrollable iframe viewer
        const pdfHtml = f.pdf
            ? `<div class="feed-pdf">
                <div class="feed-pdf-bar">
                    <span class="feed-pdf-label">📄 ${f.pdfLabel || f.pdf.split('/').pop()}</span>
                    <a class="feed-pdf-open" href="${f.pdf}" target="_blank">open ↗</a>
                </div>
                <iframe class="feed-pdf-iframe" src="${f.pdf}" loading="lazy"></iframe>
               </div>`
            : "";

        // html preview: inline iframe with expand button
        const htmlPreviewHtml = f.htmlPreview
            ? `<div class="feed-html-preview">
                <div class="feed-html-bar">
                    <span class="feed-html-label">Live preview</span>
                    <a class="feed-html-open" href="${f.htmlPreview}" target="_blank">open ↗</a>
                </div>
                <div class="feed-iframe-wrap">
                    <iframe src="${f.htmlPreview}" loading="lazy" sandbox="allow-scripts allow-same-origin" scrolling="no"></iframe>
                    <div class="feed-iframe-expand" onclick="openHtmlLightbox('${f.htmlPreview}')" title="Expand"></div>
                </div>
               </div>`
            : "";

        return `
        <div class="feed-item">
            <div class="feed-date">${formatDate(f.date)}</div>
            <p class="feed-text">${f.text}</p>
            ${imagesHtml}
            ${pdfHtml}
            ${htmlPreviewHtml}
            <div class="feed-footer">
                <div class="project-tags">${tags}</div>
                <div class="feed-meta">
                    ${orgBadge}
                    ${projectBadge}
                </div>
            </div>
        </div>`;
    }).join("");
}

// ─────────────────────────────────────────────
//  Lightbox
// ─────────────────────────────────────────────
function openLightbox(src) {
    const lb = document.getElementById("lightbox");
    document.getElementById("lightbox-img").src = src;
    lb.classList.add("open");
}

function openHtmlLightbox(src) {
    const lb = document.getElementById("html-lightbox");
    document.getElementById("html-lightbox-iframe").src = src;
    lb.classList.add("open");
}

document.addEventListener("click", e => {
    if (e.target.id === "lightbox") document.getElementById("lightbox").classList.remove("open");
    if (e.target.id === "html-lightbox") {
        const lb = document.getElementById("html-lightbox");
        lb.classList.remove("open");
        document.getElementById("html-lightbox-iframe").src = "";
    }
});
document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
        document.getElementById("lightbox").classList.remove("open");
        const lb = document.getElementById("html-lightbox");
        lb.classList.remove("open");
        document.getElementById("html-lightbox-iframe").src = "";
    }
});

// ─────────────────────────────────────────────
//  Scroll progress
// ─────────────────────────────────────────────
window.onscroll = () => {
    const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
    const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    document.getElementById("myBar").style.width = (winScroll / height * 100) + "%";
};

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
initControls();
render();
</script>
